# ============================================================
# 研究雷达 research_radar.yaml
# 目的：补上「容易漏掉的高价值研究员长文 / 实验室研究页 / 国产模型论文」
# ============================================================

meta:
  version: 4
  updated: 2026-07-21
  owner_note: >
    这不是普通信源清单，而是每日调研前必须先扫的高优先级雷达。
    它用于发现没有进入官方新闻稿、但在 X Article、研究员博客、
    alignment/research 子站、Hugging Face model card、GitHub tech report 中
    正在被核心圈讨论的内容。

priority_policy:
  hard_priority_order:
    - domestic_lab_model_release
    - domestic_lab_product_ops
    - domestic_lab_research
    - researcher_longform_recent
    - lab_research_official
    - chinese_frontier_lab_release
    - paper_with_social_discussion
    - open_source_finance_quant_agent
  date_windows:
    researcher_longform_recent_days: 10
    lab_research_recent_days: 21
    chinese_lab_recent_days: 30
    paper_recent_days: 21
    oss_recent_days: 21
  daily_quotas:
    min_researcher_longform_or_lab_research: 2
    min_chinese_frontier_lab_checks: 8
    min_domestic_model_release_candidates: 2
    min_domestic_product_ops_candidates: 2
    min_domestic_research_candidates: 2
    min_finance_quant_oss_candidates: 6
    min_finance_quant_oss_selected: 2
  source_weight:
    official_research_page: 1.0
    official_model_card_or_github: 0.95
    researcher_x_article: 0.92
    researcher_blog_or_newsletter: 0.9
    x_status_with_discussion: 0.82
    reputable_media_summary: 0.65
  fail_rule: >
    国内核心厂商必须每日全部轮询，并把模型发布、产品/运营动作、论文/技术研究分成三条独立记录。
    任一轨道没有入选时，必须记录实际查询、候选数和淘汰原因；不允许用
    「已扫描」或维护一个索引页来代替证据。

domestic_lab_scan_policy:
  core_daily:
    - Qwen / 通义千问
    - DeepSeek / 深度求索
    - Moonshot AI / Kimi
    - Z.ai / 智谱 GLM
    - ByteDance Seed / 豆包
    - Tencent Hunyuan / 腾讯混元
    - Baidu ERNIE / 文心
    - MiniMax
  extended_rotation:
    - StepFun / 阶跃星辰
    - Huawei Pangu / 华为盘古
    - InternLM / 书生浦语
    - Meituan LongCat / 美团龙猫
    - Xiaomi MiMo / 小米
    - InclusionAI / 蚂蚁百灵
  activity_tracks:
    model_release:
      sources: [official_blog, official_x, huggingface_model_card, github_release]
      watch_for: [new model, preview, open weights, benchmark, API availability, context length]
    product_ops:
      sources: [product_docs, pricing_page, subscription_page, changelog, official_x]
      watch_for: [quota, credits, pricing, subscription, capacity, rollout, plan, IDE, app, API]
    research:
      sources: [research_page, paper, technical_report, model_card, official_github]
      watch_for: [paper, report, architecture, training, post-training, inference, evaluation]
  selection_rule: >
    每个厂商先分轨扫描，再按当天信号强度选入。模型预告只能写已确认的预览入口和官宣；
    尚未公开的权重不能写成已发布。产品套餐、限额、容量和开发者工具要与模型能力分开记录；
    论文和技术报告优先使用可定位到具体页面的一手来源。

longform_detail_policy:
  applies_to:
    - x_article
    - official_research
    - technical_report
    - model_card
    - long_blog
  min_detail_chars_zh: 650
  target_detail_chars_zh: 900
  max_detail_chars_zh: 1400
  required_sections:
    - 背景：这篇文章/论文在回答什么问题
    - 核心观点：作者真正想表达的 3-5 点
    - 方法/机制：如果有技术或工作流，讲清大致逻辑
    - 案例：给一个产品经理也能理解的例子
    - 价值：对 AI 产品、Agent 工程、评测或行业判断的启发
    - 边界：哪些结论还不能过度外推
  dashboard_rule: >
    对长文不要只写摘要。summary 负责 2-3 句小白版，
    detail 负责让用户不跳原文也能了解七七八八。
    如果原文很长，优先提炼结构、论证链和可复用方法，而不是逐段复述。

researcher_longform_watchlist:
  # Frontier AI / AGI / science
  - handle: "@demishassabis"
    name: "Demis Hassabis"
    org: "Google DeepMind / Isomorphic Labs"
    focus: ["AGI timeline", "frontier AI", "AI for science", "governance"]
    urls:
      - "https://x.com/demishassabis"
      - "https://demishassabis.substack.com/"
    why: 其个人 X Article / 长文会直接影响 AGI 时间线、前沿模型治理和 AI for Science 讨论，必须按文章标题与具体 status 发现，不能只扫 DeepMind 官网索引

  # Anthropic / Claude Code / Agent 工程
