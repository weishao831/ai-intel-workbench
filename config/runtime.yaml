# ============================================================
# 运行配置 runtime.yaml —— 本地运行、agent 命令、服务端口、定时任务
# ============================================================
workspace: .
server_host: 127.0.0.1
server_port: 4318
output_language: zh

# 可选：让定时任务调用 Claude Code / Codex CLI 完成调研。
# 占位符：
#   {date}   YYYY-MM-DD
#   {root}   当前工作台根目录
#   {prompt} scripts/run_daily.py 生成的 research_prompt.md
#
# 示例（按本机实际 CLI 调整，默认留空，不自动调用任何外部 agent）：
# agent_command: claude -p "$(cat {prompt})"
# agent_command: codex exec "$(cat {prompt})"
agent_command:

schedule_time: "09:30"
schedule_push: true
provider_default: public-web

# X 浏览器安全边界：工作日定时任务可执行少量、只读的 X 站内搜索。
# 每次只读取首屏，不滚动、不点赞/关注/转发/发帖；遇到登录墙、验证码或挑战立即停止。
x_browser_mode: scheduled_limited_readonly
x_scheduled_browser_automation: true
x_scheduled_search_limit: 6
x_scheduled_results_per_query: 8
x_scheduled_scroll_pages: 0
x_scheduled_min_query_interval_seconds: 10
x_scheduled_post_load_wait_seconds: 3
x_scheduled_allow_actions: false
x_stop_on_challenge: true
