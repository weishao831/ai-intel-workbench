# ============================================================
# 推送配置 push.yaml —— 每日信息整合完成后，把精华推送到机器人
# 开源后：机器人类型(bot_type)与地址(webhook)均可配置，支持多机器人。
# ============================================================
enabled: false
bot_type: lark
webhook: ""
# primary_only 只会自动推送 primary_target_key；其他本地机器人可保留配置但不参与日常任务。
target_policy: primary_only
primary_target_key: DAILY_INTEL_LARK_WEBHOOK
hot_topics: 5             # 推送几条「今日热点」
per_dimension: 1          # 普通维度每维度推送几条
top3_dimensions: kol,oss,fin   # 这些维度推「每日 Top3」（KOL 观点 / 开源项目 / AI×金融）
title_prefix: "AI 每日情报"
note: 开源默认不内置 webhook。运行 scripts/init.py 或手动写入本机 config/push.yaml 后再启用推送。

# 多机器人示例（开源后启用）：
# bots:
#   - { type: lark,  webhook: "https://open.larksuite.com/open-apis/bot/v2/hook/xxx" }
#   - { type: wecom, webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx" }
